[project]
name = "erdtree"
version = "0.1.0"
description = "Core service in Slotty platform"
readme = "README.md"
authors = [
    { name = "churakovra", email = "churakov.main@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
